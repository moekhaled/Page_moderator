version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: page_moderator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d page_moderator"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/page_moderator
    command: ["python", "-m", "app.run_migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/page_moderator
    ports:
      - "8000:8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  llm-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/page_moderator
    command: ["python", "-m", "app.workers.llm_worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  outbound-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/page_moderator
    command: ["python", "-m", "app.workers.outbound_worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
